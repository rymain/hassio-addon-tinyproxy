---
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: yamllint -d relaxed repository.yaml tinyproxy/config.yaml tinyproxy/build.yaml .github/workflows/ci.yaml
      - name: shellcheck
        run: |
          shellcheck -s bash -e SC1008,SC2148 \
            tinyproxy/rootfs/etc/s6-overlay/s6-rc.d/tinyproxy/run \
            tinyproxy/rootfs/etc/s6-overlay/s6-rc.d/tinyproxy/finish
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: tinyproxy/Dockerfile

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.arch }}
        run: |
          declare -A PLAT=([aarch64]=linux/arm64 [amd64]=linux/amd64 [armv7]=linux/arm/v7)
          docker buildx build \
            --platform "${PLAT[${{ matrix.arch }}]}" \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21 \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION=ci \
            tinyproxy
        shell: bash
